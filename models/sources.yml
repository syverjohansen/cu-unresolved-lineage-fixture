version: 2

sources:
  - name: cu_fixture
    description: Order records available to reconciliation models.
    database: learning_hive
    schema: cu_fixture
    tables:
      - name: raw_orders
        description: Incoming order records.
        columns:
          - name: order_id
            description: Stable order identifier.
          - name: amount
            description: Order amount.
          - name: order_date
            description: Date assigned to the order.

models:
  - name: unresolved_order_summary
    description: Daily order reconciliation totals.
    columns:
      - name: order_date
        description: Reconciliation date.
      - name: order_count
        description: Number of orders on the date.
      - name: gross_amount
        description: Total order amount on the date.
